<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>eFoil Racing Prototype</title>
  <style>
	html, body {
	  margin: 0;
	  padding: 0;
	  height: 100%;
	  width: 100%;
	  background: #333;
	  font-family: sans-serif;
	  color: #fff;
	  overflow: hidden;
	}
	#gameCanvas {
	  display: block;
	  background: #222;
	  touch-action: none;
	}
	/* Lap time & telemetry display */
	#lapTimeDisplay, #speedDisplay, #bankAngleDisplay {
	  position: absolute;
	  left: 50%;
	  transform: translateX(-50%);
	  color: #fff;
	  text-shadow: 2px 2px 2px #000;
	}
	#lapTimeDisplay { bottom: 80px; font-size: 28px; font-weight: 300; }
	#speedDisplay { bottom: 50px; font-size: 14px; font-family: Helvetica, sans-serif; font-weight: 300; }
	#bankAngleDisplay { bottom: 20px; font-size: 14px; font-family: Helvetica, sans-serif; font-weight: 300; }

	/* Lap history (legacy DOM list; live telemetry is canvas, top-left) */
	#lapHistory {
	  position: absolute;
	  top: 80px;
	  right: 20px;
	  background: rgba(0, 0, 0, 0.7);
	  padding: 10px;
	  border-radius: 8px;
	  max-height: 300px;
	  overflow-y: auto;
	  font-size: 14px;
	  width: 220px;
	  visibility: hidden;
	  pointer-events: none;
	}

	#rideChrome {
	  position: absolute;
	  top: 16px;
	  left: 16px;
	  z-index: 6;
	  display: flex;
	  flex-direction: column;
	  align-items: flex-start;
	  gap: 10px;
	  pointer-events: none;
	}
	#rideChrome .hudLink,
	#rideChrome #ghostCustomize {
	  pointer-events: auto;
	}
	#rideChrome .hudLink {
	  display: inline-block;
	  color: #7fd4ff;
	  background: transparent;
	  border: none;
	  padding: 10px 0;
	  margin: 0;
	  min-height: 44px;
	  font-family: sans-serif;
	  font-size: 14px;
	  text-decoration: none;
	  text-shadow: 0 1px 3px #000;
	  cursor: pointer;
	  text-align: left;
	  -webkit-tap-highlight-color: rgba(127, 212, 255, 0.25);
	  touch-action: manipulation;
	  user-select: none;
	  pointer-events: auto;
	}
	#designerLink.hudLink {
	  position: relative;
	  padding: 2px 0;
	  min-height: 0;
	}
	#designerLink.hudLink::after {
	  content: '';
	  position: absolute;
	  top: -12px;
	  right: -8px;
	  bottom: -4px;
	  left: -8px;
	}
	#rideChrome .hudLink:hover { text-decoration: underline; }
	#ghostHud {
	  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	  font-size: 14px;
	  line-height: 18px;
	  color: #fff;
	  text-shadow: 1px 1px 2px #000;
	  pointer-events: none;
	  white-space: pre;
	}
	#ghostHudDelta {
	  color: #ffd54a;
	  margin-top: 2px;
	}
	#ghostCustomize {
	  display: none;
	  flex-direction: column;
	  align-items: stretch;
	  gap: 2px;
	  padding: 8px 12px 10px;
	  min-width: 200px;
	  background: rgba(12, 18, 24, 0.78);
	  backdrop-filter: blur(16px);
	  -webkit-backdrop-filter: blur(16px);
	  border: 1px solid rgba(255,255,255,0.14);
	  border-radius: 12px;
	  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
	  pointer-events: auto;
	}
	#ghostCustomize.open { display: flex; }
	#ghostCustomize .hudLink {
	  width: 100%;
	  padding: 10px 4px;
	}
	#fileLabel {
	  color: rgba(255,255,255,0.55);
	  font-size: 12px;
	  padding: 4px;
	  text-shadow: 0 1px 3px #000;
	}
	#viewChrome {
	  position: fixed;
	  top: 10px;
	  right: 10px;
	  z-index: 1000;
	  display: flex;
	  flex-direction: column;
	  align-items: flex-end;
	  gap: 10px;
	  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	  font-size: 13px;
	  line-height: 1.35;
	  text-shadow: 0 1px 3px #000;
	  pointer-events: none;
	  touch-action: manipulation;
	}
	#viewChrome .viewChromeRow {
	  display: flex;
	  align-items: baseline;
	  justify-content: flex-end;
	  gap: 2px;
	  width: auto;
	  min-height: 0;
	}
	#viewChrome a,
	#viewChrome button {
	  position: relative;
	  color: #7fd4ff;
	  background: transparent;
	  border: none;
	  padding: 1px 6px;
	  margin: 0;
	  min-height: 0;
	  font: inherit;
	  line-height: 1.35;
	  text-decoration: none;
	  cursor: pointer;
	  -webkit-tap-highlight-color: rgba(127, 212, 255, 0.25);
	  touch-action: manipulation;
	  user-select: none;
	  pointer-events: auto;
	}
	/* Keep a ~44px tap target without a blank row between F and P. */
	#viewChrome a::after,
	#viewChrome button::after {
	  content: '';
	  position: absolute;
	  top: -12px;
	  right: -8px;
	  bottom: -12px;
	  left: -8px;
	}
	#pathBtn {
	  width: auto;
	  text-align: right;
	}
	#viewChrome a:hover,
	#viewChrome button:hover { text-decoration: underline; }
	#viewChrome .viewChromeSep {
	  color: rgba(255,255,255,0.45);
	  padding: 0 2px;
	  pointer-events: none;
	}

	#atlasHud {
	  position: absolute;
	  inset: 0;
	  z-index: 5;
	  pointer-events: none;
	  touch-action: none;
	  display: none;
	}
	body.atlas-open #atlasHud {
	  display: block;
	  pointer-events: none;
	}
	#lapTimeDisplay, #speedDisplay, #bankAngleDisplay,
	#lapHistory {
	  opacity: 1;
	}
	body.atlas-open #lapTimeDisplay,
	body.atlas-open #speedDisplay,
	body.atlas-open #bankAngleDisplay,
	body.atlas-open #lapHistory,
	body.atlas-open #customizeGhostBtn,
	body.atlas-open #ghostCustomize,
	body.atlas-open #ghostHud {
	  display: none;
	}

	#atlasCard, #atlasLayouts, #atlasEmpty, #atlasConfirm {
	  pointer-events: auto;
	  position: absolute;
	  background: rgba(12, 18, 24, 0.78);
	  backdrop-filter: blur(16px);
	  -webkit-backdrop-filter: blur(16px);
	  border: 1px solid rgba(255,255,255,0.14);
	  border-radius: 14px;
	  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
	}
	#atlasCard, #atlasLayouts {
	  left: 24px;
	  top: 50%;
	  transform: translateY(-50%);
	  width: min(320px, calc(100vw - 48px));
	  padding: 14px 16px;
	  display: none;
	}
	#atlasCard.open, #atlasLayouts.open { display: block; }
	.atlas-card-head {
	  display: flex; align-items: center; gap: 8px;
	  font-size: 16px; font-weight: 700; margin-bottom: 10px;
	}
	.atlas-flag { font-size: 22px; line-height: 1; }
	.atlas-card-list { display: flex; flex-direction: column; gap: 2px; }
	.atlas-card-list button {
	  display: block; width: 100%; text-align: left;
	  background: transparent; border: none; color: #fff;
	  font-size: 14px; padding: 8px 10px; border-radius: 6px; cursor: pointer;
	}
	.atlas-card-list button:hover { background: rgba(255,255,255,0.08); }
	#atlasLayoutsBtn {
	  pointer-events: auto;
	  position: absolute;
	  left: 24px;
	  bottom: 24px;
	  background: rgba(12, 18, 24, 0.78);
	  backdrop-filter: blur(12px);
	  -webkit-backdrop-filter: blur(12px);
	  border: 1px solid rgba(255,255,255,0.14);
	  color: #fff;
	  border-radius: 20px;
	  padding: 8px 14px;
	  font-size: 13px;
	  cursor: pointer;
	  display: none;
	}
	#atlasLayoutsBtn.show { display: inline-block; }
	#atlasEmpty {
	  left: 50%; top: 50%; transform: translate(-50%, -50%);
	  width: min(360px, calc(100vw - 48px));
	  padding: 20px 22px;
	  text-align: center;
	  display: none;
	}
	#atlasEmpty.open { display: block; }
	#atlasEmpty p { margin: 0 0 12px; color: rgba(255,255,255,0.78); font-size: 14px; line-height: 1.45; }
	#atlasEmpty a { color: #7fd4ff; }
	#atlasConfirm {
	  left: 50%; top: 50%; transform: translate(-50%, -50%);
	  width: min(340px, calc(100vw - 48px));
	  padding: 20px 22px;
	  text-align: center;
	  display: none;
	  z-index: 10;
	}
	#atlasConfirm.open { display: block; }
	#atlasConfirm p { margin: 0 0 14px; font-size: 14px; line-height: 1.45; }
	#atlasConfirm .row { display: flex; gap: 8px; justify-content: center; }
	#atlasConfirm button {
	  border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px;
	}
	#atlasConfirmYes { background: #ffd54a; color: #1a1400; font-weight: 700; }
	#atlasConfirmNo { background: rgba(255,255,255,0.1); color: #fff; }

	@media (max-width: 700px) {
	  #atlasCard, #atlasLayouts {
	    left: 12px; right: 12px; width: auto;
	    top: auto; bottom: 64px; transform: none;
	  }
	  #atlasLayoutsBtn { left: 12px; bottom: 16px; }
	}
  </style>
</head>
<body>
  <!-- Audio elements -->
  <audio id="windAudio" src="wind.mp3" loop preload="auto"></audio>
  <audio id="musicAudio" src="game_music.mp3" preload="auto"></audio>
  <audio id="boomStopAudio" src="boom_stop.mp3" preload="auto"></audio>
  <audio id="collisionAudio" src="collision.wav" preload="auto"></audio>

  <canvas id="gameCanvas"></canvas>

  <!-- Lap time & telemetry -->
  <div id="lapTimeDisplay">Laptime: 0.00</div>
  <div id="speedDisplay">Speed: 0.0 km/h</div>
  <div id="bankAngleDisplay">Bank: 0°</div>

  <!-- Lap history -->
  <div id="lapHistory"></div>

  <!-- Line-variant select is mounted here when a track has several ghosts -->
  <div id="ghostInfo" hidden></div>
  <div id="ghostStats" hidden></div>

  <!-- Ride / atlas chrome -->
  <div id="rideChrome">
	<a id="designerLink" class="hudLink" href="designer.html">Design a track &rarr;</a>
	<div id="ghostHud">
	  <div id="ghostHudTitle">Ghost: —</div>
	  <div id="ghostHudBody"></div>
	  <div id="ghostHudDelta"></div>
	</div>
	<button type="button" class="hudLink" id="customizeGhostBtn" aria-expanded="false">Customize ghost</button>
	<div id="ghostCustomize">
	  <button type="button" class="hudLink" id="keepGhostBtn">G Keep current ghost</button>
	  <button type="button" class="hudLink" id="exportGhostBtn">Export ghost</button>
	  <button type="button" class="hudLink" id="chooseFileBtn">Choose file</button>
	  <span id="fileLabel">ghost JSON or session CSV</span>
	  <input type="file" id="importGhostFile" accept=".json,.csv,application/json,text/csv" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
	</div>
  </div>
  <div id="viewChrome">
	<div class="viewChromeRow">
	  <a id="atlasHint" href="#">T World Map</a>
	  <span class="viewChromeSep" aria-hidden="true">•</span>
	  <button type="button" id="fullscreenBtn">F Fullscreen</button>
	</div>
	<div class="viewChromeRow" id="pathChromeRow">
	  <button type="button" id="pathBtn">P Hide Path</button>
	</div>
  </div>
  <div id="atlasHud">
	<div id="atlasCard"></div>
	<div id="atlasLayouts"></div>
	<button type="button" id="atlasLayoutsBtn">Layouts</button>
	<div id="atlasEmpty">
	  <p>No saved tracks yet. Design a course, save it with a map location, then pick it from the world.</p>
	  <a href="designer.html">Open the designer</a>
	</div>
  </div>
  <div id="atlasConfirm">
	<p>Leave this lap for the world map?</p>
	<div class="row">
	  <button type="button" id="atlasConfirmYes">Leave lap</button>
	  <button type="button" id="atlasConfirmNo">Keep racing</button>
	</div>
  </div>

  <!-- Load configuration and engine files -->
  <script src="lib/lz-string.min.js"></script>
  <script type="module" src="engine.js"></script>
</body>
</html>
