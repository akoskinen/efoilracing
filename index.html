<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>eFoil Racing Prototype</title>
  <style>
	html, body {
	  margin: 0;
	  padding: 0;
	  height: 100%;
	  width: 100%;
	  background: #333;
	  font-family: sans-serif;
	  color: #fff;
	  overflow: hidden;
	}
	#gameCanvas {
	  display: block;
	  background: #222;
	  touch-action: none;
	}
	/* Lap time & telemetry display */
	#lapTimeDisplay, #speedDisplay, #bankAngleDisplay {
	  position: absolute;
	  left: 50%;
	  transform: translateX(-50%);
	  color: #fff;
	  text-shadow: 2px 2px 2px #000;
	}
	#lapTimeDisplay { bottom: 80px; font-size: 28px; font-weight: 300; }
	#speedDisplay { bottom: 50px; font-size: 14px; font-family: Helvetica, sans-serif; font-weight: 300; }
	#bankAngleDisplay { bottom: 20px; font-size: 14px; font-family: Helvetica, sans-serif; font-weight: 300; }

	/* Lap history */
	#lapHistory {
	  position: absolute;
	  top: 80px;
	  right: 20px;
	  background: rgba(0, 0, 0, 0.7);
	  padding: 10px;
	  border-radius: 8px;
	  max-height: 300px;
	  overflow-y: auto;
	  font-size: 14px;
	  width: 220px;
	  visibility: hidden;
	}
	
	/* Ghost Import/Export Controls */
	#ghostControls {
	  position: absolute;
	  bottom: 20px;
	  left: 20px;
	  background: rgba(0, 0, 0, 0.7);
	  padding: 10px;
	  border-radius: 8px;
	  font-size: 14px;
	}
	#ghostControls button,
	#ghostControls input[type="file"] {
	  display: block;
	  margin: 6px 0;
	}
	
	/* Ghost info (checkboxes + stats), kept clear of the export panel */
	#ghostInfo {
	  position: absolute;
	  bottom: 20px;
	  left: 290px;
	  color: #fff;
	  font-family: monospace;
	  font-size: 14px;
	  line-height: 1.45;
	  text-shadow: 1px 1px 2px #000;
	}
	#ghostStats {
	  display: block;
	  margin-top: 2px;
	}
	#ghostStats .ghost-time {
	  display: block;
	}

	#rideChrome {
	  position: absolute;
	  top: 16px;
	  left: 16px;
	  z-index: 4;
	}
	#designerLink {
	  display: inline-block;
	  color: #7fd4ff;
	  text-decoration: none;
	  font-size: 14px;
	  text-shadow: 0 1px 3px #000;
	}
	#atlasHint {
	  margin-top: 6px;
	  color: rgba(255,255,255,0.72);
	  font-size: 12px;
	  text-shadow: 0 1px 3px #000;
	}

	#atlasHud {
	  position: absolute;
	  inset: 0;
	  z-index: 5;
	  pointer-events: none;
	  touch-action: none;
	  display: none;
	}
	body.atlas-open #atlasHud {
	  display: block;
	  pointer-events: auto;
	}
	#lapTimeDisplay, #speedDisplay, #bankAngleDisplay,
	#lapHistory, #ghostInfo, #ghostControls {
	  opacity: 1;
	}
	body.atlas-open #lapTimeDisplay,
	body.atlas-open #speedDisplay,
	body.atlas-open #bankAngleDisplay,
	body.atlas-open #lapHistory,
	body.atlas-open #ghostInfo,
	body.atlas-open #ghostControls {
	  opacity: 0;
	  pointer-events: none;
	}

	#atlasCard, #atlasLayouts, #atlasEmpty, #atlasConfirm {
	  pointer-events: auto;
	  position: absolute;
	  background: rgba(12, 18, 24, 0.78);
	  backdrop-filter: blur(16px);
	  -webkit-backdrop-filter: blur(16px);
	  border: 1px solid rgba(255,255,255,0.14);
	  border-radius: 14px;
	  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
	}
	#atlasCard, #atlasLayouts {
	  left: 24px;
	  top: 50%;
	  transform: translateY(-50%);
	  width: min(320px, calc(100vw - 48px));
	  padding: 14px 16px;
	  display: none;
	}
	#atlasCard.open, #atlasLayouts.open { display: block; }
	.atlas-card-head {
	  display: flex; align-items: center; gap: 8px;
	  font-size: 16px; font-weight: 700; margin-bottom: 10px;
	}
	.atlas-flag { font-size: 22px; line-height: 1; }
	.atlas-card-list { display: flex; flex-direction: column; gap: 2px; }
	.atlas-card-list button {
	  display: block; width: 100%; text-align: left;
	  background: transparent; border: none; color: #fff;
	  font-size: 14px; padding: 8px 10px; border-radius: 6px; cursor: pointer;
	}
	.atlas-card-list button:hover { background: rgba(255,255,255,0.08); }
	#atlasLayoutsBtn {
	  pointer-events: auto;
	  position: absolute;
	  left: 24px;
	  bottom: 24px;
	  background: rgba(12, 18, 24, 0.78);
	  backdrop-filter: blur(12px);
	  -webkit-backdrop-filter: blur(12px);
	  border: 1px solid rgba(255,255,255,0.14);
	  color: #fff;
	  border-radius: 20px;
	  padding: 8px 14px;
	  font-size: 13px;
	  cursor: pointer;
	  display: none;
	}
	#atlasLayoutsBtn.show { display: inline-block; }
	#atlasEmpty {
	  left: 50%; top: 50%; transform: translate(-50%, -50%);
	  width: min(360px, calc(100vw - 48px));
	  padding: 20px 22px;
	  text-align: center;
	  display: none;
	}
	#atlasEmpty.open { display: block; }
	#atlasEmpty p { margin: 0 0 12px; color: rgba(255,255,255,0.78); font-size: 14px; line-height: 1.45; }
	#atlasEmpty a { color: #7fd4ff; }
	#atlasConfirm {
	  left: 50%; top: 50%; transform: translate(-50%, -50%);
	  width: min(340px, calc(100vw - 48px));
	  padding: 20px 22px;
	  text-align: center;
	  display: none;
	  z-index: 10;
	}
	#atlasConfirm.open { display: block; }
	#atlasConfirm p { margin: 0 0 14px; font-size: 14px; line-height: 1.45; }
	#atlasConfirm .row { display: flex; gap: 8px; justify-content: center; }
	#atlasConfirm button {
	  border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px;
	}
	#atlasConfirmYes { background: #ffd54a; color: #1a1400; font-weight: 700; }
	#atlasConfirmNo { background: rgba(255,255,255,0.1); color: #fff; }

	@media (max-width: 700px) {
	  #atlasCard, #atlasLayouts {
	    left: 12px; right: 12px; width: auto;
	    top: auto; bottom: 64px; transform: none;
	  }
	  #atlasLayoutsBtn { left: 12px; bottom: 16px; }
	}
  </style>
</head>
<body>
  <!-- Audio elements -->
  <audio id="windAudio" src="wind.mp3" loop preload="auto"></audio>
  <audio id="musicAudio" src="game_music.mp3" preload="auto"></audio>
  <audio id="boomStopAudio" src="boom_stop.mp3" preload="auto"></audio>
  <audio id="collisionAudio" src="collision.wav" preload="auto"></audio>

  <canvas id="gameCanvas"></canvas>

  <!-- Lap time & telemetry -->
  <div id="lapTimeDisplay">Laptime: 0.00</div>
  <div id="speedDisplay">Speed: 0.0 km/h</div>
  <div id="bankAngleDisplay">Bank: 0°</div>

  <!-- Lap history -->
  <div id="lapHistory"></div>

  <!-- Ghost Info -->
  <div id="ghostInfo">
    <label id="racingLineToggleRow">
      <input type="checkbox" id="showRacingLines" checked> show racing line
    </label>
    <br>
    <label>
      <input type="checkbox" id="keepGhost"> keep racing against this ghost:
    </label>
    <div id="ghostStats">No ghost loaded</div>
  </div>

  <!-- Ghost controls -->
  <div id="ghostControls" style="position: absolute; bottom: 20px; left: 20px; padding: 10px; background-color: rgba(0,0,0,0.5); border: 1px dashed rgba(255,255,255,0.3); transition: background-color 0.2s;">
	<button id="exportGhostBtn">Export Ghost</button><br>
	<input type="file" id="importGhostFile" accept=".json,.csv,application/json,text/csv" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
	<button id="chooseFileBtn">Choose File</button> <span id="fileLabel">ghost JSON or session CSV</span><br>
	<button id="clearGhostBtn">Clear Ghost</button>
  </div>

  <!-- Ride / atlas chrome -->
  <div id="rideChrome">
	<a id="designerLink" href="designer.html">Design a track &rarr;</a>
	<div id="atlasHint">T world map</div>
  </div>
  <div id="atlasHud">
	<div id="atlasCard"></div>
	<div id="atlasLayouts"></div>
	<button type="button" id="atlasLayoutsBtn">Layouts</button>
	<div id="atlasEmpty">
	  <p>No saved tracks yet. Design a course, save it with a map location, then pick it from the world.</p>
	  <a href="designer.html">Open the designer</a>
	</div>
  </div>
  <div id="atlasConfirm">
	<p>Leave this lap for the world map?</p>
	<div class="row">
	  <button type="button" id="atlasConfirmYes">Leave lap</button>
	  <button type="button" id="atlasConfirmNo">Keep racing</button>
	</div>
  </div>

  <!-- Load configuration and engine files -->
  <script src="lib/lz-string.min.js"></script>
  <script type="module" src="engine.js"></script>
</body>
</html>
