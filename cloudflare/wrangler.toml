name = "efoil-racing"
main = "worker.js"
compatibility_date = "2026-11-26"

# Create the database, then paste its id here:
#   npx wrangler d1 create efoil-racing
[[d1_databases]]
binding = "DB"
database_name = "efoil-racing"
database_id = "00000000-0000-0000-0000-000000000000"

# Writes require this secret. Reads stay public.
#   npx wrangler secret put WRITE_TOKEN
